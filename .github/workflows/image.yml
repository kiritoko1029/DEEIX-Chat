name: Image

# Publish Web/API images only from version tags. Branch builds run without push in CI.
# A stable tag push promotes latest; prereleases and manual tag rebuilds never do.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication across tags so architecture merges cannot race latest.
# Do not cancel an in-progress release halfway through publishing registries.
concurrency:
  group: image-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release and Docker Hub configuration
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.release.outputs.plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate tag, version and registry target
        id: release
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/image-release.mjs
      - name: Verify synchronized runtime versions
        run: |
          node scripts/sync-version.mjs --check workspace
          node scripts/sync-version.mjs --check web
          node scripts/sync-version.mjs --check backend

  build:
    name: Build (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # The download and compile caches are the expensive part of a cold build (measured without
      # them: pnpm install 157s, go mod download 104s, go build 32s). The Turbopack cache is left out:
      # a cold Next build takes about 20s and the cache would cost ~1 GB of the repository quota.
      # Keyed on the lockfiles, which is when dependencies change; the Go build cache is
      # content-addressed, so restoring an older one still saves most of the compile.
      - name: Cache BuildKit cache mounts
        id: mounts
        uses: actions/cache@v5
        with:
          path: |
            buildkit-cache/pnpm-store
            buildkit-cache/go-mod
            buildkit-cache/go-build
          key: image-mounts-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'backend/go.sum') }}
          restore-keys: |
            image-mounts-${{ matrix.arch }}-

      # Copies the restored directories into the builder's cache mounts before the build and back out
      # afterwards. Ids and targets must match the RUN --mount flags in the Dockerfile.
      - name: Inject cache mounts into the builder
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "buildkit-cache/pnpm-store": { "target": "/pnpm/store", "id": "pnpm-store" },
              "buildkit-cache/go-mod": { "target": "/go/pkg/mod", "id": "go-mod" },
              "buildkit-cache/go-build": { "target": "/root/.cache/go-build", "id": "go-build" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Run-scoped staging tags keep manifests independent of mutable release aliases.
      - name: Resolve staging tags
        id: staging
        env:
          PLAN: ${{ needs.validate.outputs.plan }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tags=$(jq -r --arg arch "$ARCH" '.staging as $staging | [.images[] + ":" + $staging + "-" + $arch] | join(",")' <<< "$PLAN")
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and publish native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.staging.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ fromJSON(needs.validate.outputs.plan).version }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            REFRESH_CATALOG_SNAPSHOTS=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=min

  merge:
    name: Publish and verify multiarch manifests
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and verify manifest lists
        env:
          PLAN: ${{ needs.validate.outputs.plan }}
        run: |
          set -euo pipefail
          staging=$(jq -r .staging <<< "$PLAN")
          while IFS= read -r image; do
            args=()
            while IFS= read -r tag; do
              args+=(--tag "$image:$tag")
            done < <(jq -r '.tags[]' <<< "$PLAN")
            docker buildx imagetools create "${args[@]}" "$image:$staging-amd64" "$image:$staging-arm64"
            while IFS= read -r tag; do
              docker buildx imagetools inspect "$image:$tag" --raw | jq -e '
                [.manifests[].platform | select(.os == "linux") | .architecture] |
                (index("amd64") != null and index("arm64") != null)'
              echo "Verified $image:$tag (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
            done < <(jq -r '.tags[]' <<< "$PLAN")
          done < <(jq -r '.images[]' <<< "$PLAN")
          echo "Docker Hub and GHCR multiarch publication completed." >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete publication
        if: failure()
        run: echo "Publication failed or is incomplete. Do not assume all Docker Hub tags were published; inspect logs and rerun all jobs." >> "$GITHUB_STEP_SUMMARY"
